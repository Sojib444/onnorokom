# nginx configuration for the production frontend container.
#
# Serves the static Angular bundle and proxies /api requests to the API container.
# Because the browser only ever talks to this origin, CORS is not involved in the
# Docker setup. The original request URI (/api/...) is preserved.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy. client_max_body_size allows the 10 MB attachment limit plus multipart
    # overhead from the submission endpoints.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        proxy_request_buffering off;
    }

    # SPA fallback: client-side routes (/login, /admin/users, ...) must all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
