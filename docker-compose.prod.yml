name: assignment-management-prod

# Production stack for an AWS EC2 host. Unlike docker-compose.yml (which builds images
# from source for local development), this file PULLS prebuilt images from GitHub
# Container Registry - they are built and pushed by .github/workflows/ci-cd.yml on every
# push to main, and docker compose pulls the newest 'latest' tag on deploy.
#
# Configuration comes from /opt/onnorokom/.env on the server (generated by
# deploy/ec2-setup.sh). Nothing secret is baked into the image or this file.
#
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f api
#
# Entry point: http://<EC2-PUBLIC-IP>/   (nginx :80 proxies /api to the api container)
# API health:  http://127.0.0.1:5105/health   (loopback only - not internet-facing)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app

  api:
    image: ghcr.io/sojib444/onnorokom/api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Host must be the compose service name "postgres", not localhost.
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_MINUTES:-60}
      # Migrations + the idempotent seeder run on startup.
      Seed__RunOnStartup: ${SEED_ON_STARTUP:-true}
      FileStorage__RootPath: /app/uploads
      Api__EnableSwagger: "false"
      # The browser talks to the frontend origin only (nginx proxies /api same-origin),
      # so this list matters only for direct API calls. Keep the EC2 host's public
      # address here if you ever call the API from a browser directly.
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
    ports:
      # Loopback-only so the deploy script can probe /health without exposing the API
      # to the internet. All external traffic enters through the frontend on :80.
      - "127.0.0.1:${API_PORT:-5105}:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app

  frontend:
    image: ghcr.io/sojib444/onnorokom/frontend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - app

volumes:
  postgres-data:
  uploads:

networks:
  app:
