<div class="login-page">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h1>Assignment Manager</h1>
    <p class="login-subtitle">Sign in to continue</p>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="username" placeholder="you@example.com" />
      @if (fieldHasError('email')) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" placeholder="Your password" />
      @if (fieldHasError('password')) {
        <span class="field-error">Password is required.</span>
      }
    </label>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
