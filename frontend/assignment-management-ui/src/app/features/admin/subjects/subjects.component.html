<section class="page">
  <div class="page-header">
    <div>
      <h2>Subjects</h2>
      <p class="muted">Subjects taught at the institution.</p>
    </div>
    <button type="button" class="btn btn-primary" (click)="beginCreate()">New subject</button>
  </div>

  <form class="card form-card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h3>{{ editingId() ? 'Edit subject' : 'New subject' }}</h3>

    <div class="form-grid">
      <label class="field">
        <span>Name</span>
        <input formControlName="name" placeholder="e.g. Mathematics" />
        @if (fieldHasError('name')) {
          <span class="field-error">Name is required and at most 100 characters.</span>
        }
      </label>

      <label class="field">
        <span>Code</span>
        <input formControlName="code" placeholder="e.g. MATH-101" />
        @if (fieldHasError('code')) {
          <span class="field-error">Code is required and at most 20 characters.</span>
        }
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving…' : editingId() ? 'Save changes' : 'Create subject' }}
      </button>
      <button type="button" class="btn btn-ghost" (click)="cancelForm()">Cancel</button>
    </div>
  </form>

  @if (errorMessage(); as message) {
    <app-error [message]="message" [retryable]="true" (retry)="load()" />
  }

  @if (loading()) {
    <app-loading />
  } @else if (items().length === 0) {
    <app-empty message="No subjects yet. Create the first one above." />
  } @else {
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Code</th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of items(); track item.id) {
          <tr>
            <td>{{ item.name }}</td>
            <td><code>{{ item.code }}</code></td>
            <td class="col-actions">
              <button type="button" class="btn btn-small" (click)="beginEdit(item)">Edit</button>
              <button type="button" class="btn btn-small btn-danger" (click)="onDelete(item)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
